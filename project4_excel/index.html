<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project 4 – Excel Data</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #121826, #0b0f14);
  font-family: "Segoe UI", system-ui, sans-serif;
  color: #eaeaea;
  display: flex;
  justify-content: center;
  align-items: center;
}


:root {
  --bg1: #0b0f14;
  --bg2: #121826;
  --accent: #00e5ff;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", system-ui, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, var(--bg2), var(--bg1));
  display: flex;
  justify-content: center;
  align-items: center;
  color: #eaeaea;
}

.container {
  width: 100%;
  max-width: 1000px;
  padding: 24px;
}

h1 {
  text-align: center;
  color: var(--accent);
  margin-bottom: 40px;
  letter-spacing: 1px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 28px;
}

/* 🔥 EMOJI BUTTON CARD */
.project-btn {
  background: #121826;
  border-radius: 20px;
  padding: 30px 20px;
  text-align: center;
  cursor: pointer;
  border: 1px solid rgba(0,229,255,0.25);
  box-shadow: 0 0 25px rgba(0,229,255,0.08);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  user-select: none;
}

.project-btn:active {
  transform: scale(0.94);
  box-shadow: 0 0 45px rgba(0,229,255,0.6);
}

/* Emoji */
.project-btn .emoji {
  font-size: 4.2rem;
  margin-bottom: 14px;
  display: block;
}

/* Title */
.project-btn h2 {
  margin: 10px 0 6px;
  color: var(--accent);
}

/* Subtitle */
.project-btn p {
  margin: 0;
  color: #9aa4b2;
  font-size: 0.95rem;
}

/* Hover (desktop only) */
@media (hover: hover) {
  .project-btn:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 40px rgba(0,229,255,0.35);
  }
}

.card {
  background: #121826;
  border-radius: 18px;
  padding: 40px;
  text-align: center;
  border: 1px solid rgba(0,229,255,0.25);
  box-shadow: 0 0 40px rgba(0,229,255,0.15);
}

h1 {
  color: #00e5ff;
  margin-bottom: 20px;
}

button {
  background: transparent;
  color: #00e5ff;
  border: 2px solid #00e5ff;
  border-radius: 12px;
  padding: 14px 24px;
  font-size: 1.1rem;
  cursor: pointer;
  transition: 0.25s;
}

button:hover {
  background: #00e5ff;
  color: #000;
}


#lockScreen {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, #121826, #0b0f14);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.lock-card {
  background: #121826;
  padding: 40px;
  border-radius: 18px;
  text-align: center;
  border: 1px solid rgba(0,229,255,0.3);
  box-shadow: 0 0 40px rgba(0,229,255,0.2);
  max-width: 320px;
  width: 90%;
}

.lock-card h2 {
  color: #00e5ff;
}

.lock-card input {
  width: 100%;
  padding: 14px;
  margin: 16px 0;
  border-radius: 10px;
  border: none;
}

.lock-card button {
  padding: 12px 24px;
  border-radius: 10px;
  border: 2px solid #00e5ff;
  background: transparent;
  color: #00e5ff;
  cursor: pointer;
}

.lock-card button:hover {
  background: #00e5ff;
  color: #000;
}

#errorMsg {
  color: #ff6b6b;
}


</style>
</head>

<body>
<div id="lockScreen">
  <div class="lock-card">
    <h2>🔒 Restricted Access</h2>
    <p id="projectName"></p>
    <input type="password" id="passwordInput" placeholder="Enter password">
    <button onclick="unlock()">Unlock</button>
    <p id="errorMsg"></p>
  </div>
</div>

<div class="project-btn" onclick="openProject('project2_cables')">
      <span class="emoji">✉</span>
      <h2></h2>
      <button onclick="openExcel()">Open</button>
    </div>

<script>
const PROJECT_NAME = "Excel";
const PASSWORD = "Sentinel4";

document.getElementById("projectName").textContent = PROJECT_NAME;

function unlock() {
  const input = document.getElementById("passwordInput").value;
  if (input === PASSWORD) {
    sessionStorage.setItem("p2_unlocked", "yes");
    document.getElementById("lockScreen").style.display = "none";
  } else {
    document.getElementById("errorMsg").textContent = "Incorrect password";
  }
}

if (sessionStorage.getItem("p2_unlocked") === "yes") {
  document.getElementById("lockScreen").style.display = "none";
}

function openExcel() {
  window.location.href = "WOW.xlsx";
}
</script>

</body>
</html>
